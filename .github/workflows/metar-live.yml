name: METAR live

# Strict live check of aviationweather.gov through the connector's own fetch + mapping code
# (scripts/ci/metar-live.mjs). Kept out of ci.yml so an AWC outage never blocks unrelated
# PRs: it runs only when weather code changes, weekly, and on demand. The job log prints the
# raw JSON, so it doubles as a recorded response. See docs/VERIFICATION.md.

on:
  pull_request:
    paths:
      - "packages/weather/**"
      - "connector/src/core/weather.ts"
      - "connector/src/**/weather*"
      - "scripts/ci/metar-live.mjs"
      - ".github/workflows/metar-live.yml"
  push:
    branches: [main]
    paths:
      - "packages/weather/**"
      - "connector/src/core/weather.ts"
      - "connector/src/**/weather*"
      - "scripts/ci/metar-live.mjs"
      - ".github/workflows/metar-live.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metar-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - name: Build connector
        working-directory: connector
        run: npm ci && npm run build
      - name: Self-check against the hand-made fixture
        run: node scripts/ci/metar-live.mjs --file connector/fixtures/awc-metar.handmade.json --ids KMEM,KATL,KSEA,KORD,EGLL
      - name: Self-check against the recorded live response (2026-10-14)
        run: node scripts/ci/metar-live.mjs --file connector/fixtures/awc-metar.recorded-2026-10-14.json --ids KMEM,KATL,EGLL,KJFK
      - name: Live METAR check (KMEM, KATL, EGLL, KJFK)
        run: node scripts/ci/metar-live.mjs --ids KMEM,KATL,EGLL,KJFK
